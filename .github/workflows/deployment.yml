name: Build And Run Go App
on:
  push:
    branches:
      - main
      - feature/**
jobs:
  build-and-run:
     runs-on: ubuntu-latest

     steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set-up go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.22'
      
      - name: build go
        run: go run main.go
