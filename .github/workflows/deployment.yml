name: Build And Run Go App
on:
  pull_request:
    types: opened
  workflow_dispatch:
jobs:
  build-and-run:
     runs-on: ubuntu-latest

     steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set-up go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.22'

      - name: go mod tidy
        run: |
          go mod tidy
    
      - name: run tests
        run: go test ./... -v
    
  deploy:
    runs-on: ubuntu latest
    
    steps:
      - name: code checkout
        uses: actions/checkout
      - name: go set-up
        uses: actions/setup-go
        with:
          go-version: '1.24'
      - name: go build
        run: go build
      - name: go run 
        run: go run main.go
        
    